<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque CBZ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #eee; margin: 0; padding: 2rem; }
        h1 { color: #fff; border-bottom: 2px solid #555; padding-bottom: 10px; }
        .cbz-list { list-style-type: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
        .cbz-list a { 
            text-decoration: none; color: #fff; background: #333; padding: 15px; 
            border-radius: 5px; transition: background 0.2s; 
        }
        .cbz-list a:hover { background: #555; }
        
        /* Overlay Drag & Drop */
        #drop-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); color: white; display: none;
            align-items: center; justify-content: center; font-size: 2rem; z-index: 10000;
        }
        #drop-overlay.active { display: flex; }
    </style>
</head>
<body>
    <div id="drop-overlay">Déposez votre archive CBZ ici</div>

    <h1>Dossier : {{ base_dir }}</h1>
    
    {% if files %}
        <ul class="cbz-list">
            {% for file in files %}
                <li><a href="{{ url_for('read_cbz', file=file.path) }}">{{ file.name }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Aucun fichier CBZ trouvé dans ce dossier.</p>
    {% endif %}

    <script>
        // Logique commune de Drag and Drop
        let dragCounter = 0;
        const overlay = document.getElementById('drop-overlay');

        window.addEventListener('dragenter', (e) => {
            e.preventDefault(); dragCounter++; overlay.classList.add('active');
        });
        window.addEventListener('dragleave', () => {
            dragCounter--; if(dragCounter === 0) overlay.classList.remove('active');
        });
        window.addEventListener('dragover', (e) => e.preventDefault());
        
        window.addEventListener('drop', (e) => {
            e.preventDefault(); dragCounter = 0; overlay.classList.remove('active');
            
            const file = e.dataTransfer.files[0];
            if(file && file.name.toLowerCase().endsWith('.cbz')) {
                const formData = new FormData();
                formData.append('file', file);
                
                fetch('/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if(data.url) window.location.href = data.url;
                    else alert(data.error);
                }).catch(err => alert("Erreur réseau."));
            } else {
                alert("Veuillez déposer un fichier .cbz valide.");
            }
        });
    </script>
</body>
</html>
